<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>INVI</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="description" content="INVI. Site in development.">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#F7F3ED">
<meta property="og:title" content="INVI">
<meta property="og:description" content="Site in development.">
<meta property="og:url" content="https://mark200813.github.io/invi/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="INVI">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
/* -------------------------------------------------------------
   INVI - holding page

   The full build is NOT gone: it lives on the `full-site-v2`
   branch and in this repo's history at 806d99c. GitHub Pages only
   serves `main`, so none of it is reachable while this page is up.
   To put it back:  git checkout full-site-v2 -- index.html

   Same V12 foundation as the real site: bone ground, Inter only,
   the supplied wordmark as artwork (never redrawn), and a single
   locked scent gradient as the one colour interruption.
   ------------------------------------------------------------- */
:root{
  --bone:#F7F3ED; --ink:#151513; --ink-2:rgba(21,21,19,.68);
  --noise:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='190' height='190'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.82' numOctaves='2' stitchTiles='stitch'/></filter><rect width='190' height='190' filter='url(%23n)' opacity='.52'/></svg>");
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;color-scheme:light}
body{margin:0;min-height:100vh;min-height:100svh;
  display:grid;place-items:center;padding:clamp(1.5rem,5vw,2rem);
  background:var(--bone);color:var(--ink);
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  font-size:clamp(17px,.35vw + 15.6px,18px);line-height:1.556;letter-spacing:-.011em;
  -webkit-font-smoothing:antialiased;
  touch-action:manipulation;-webkit-tap-highlight-color:rgba(21,21,19,.08)}

/* device 01, tactile grain - the same tile the full site uses */
body::after{content:'';position:fixed;inset:0;z-index:2;pointer-events:none;
  background-image:var(--noise);background-size:190px 190px;
  opacity:.34;mix-blend-mode:multiply}

main{position:relative;z-index:1;width:min(30rem,100%);text-align:center}

/* The wordmark is supplied artwork: never retyped, redrawn or put in a
   container, and it keeps its 0.5x clear space. */
.mark{display:block;width:min(62vw,17rem);height:auto;margin:0 auto}

/* device 04, one colour interruption: ORIGIN at its locked 135deg with stops
   at 0/52/100. Static - V12 rules out permanently animated gradients. */
.rule{width:clamp(4rem,18vw,6.5rem);height:2px;
  margin:clamp(2.6rem,8vw,3.4rem) auto 0;border:0;
  background:linear-gradient(135deg,#3F7FA3 0%,#78BFD0 52%,#6F9B4B 100%)}

h1{margin:clamp(2.2rem,7vw,2.8rem) 0 0;
  font-size:.75rem;font-weight:500;line-height:1.333;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink-2)}
p{margin:.9rem 0 0;color:var(--ink-2);text-wrap:balance}
a{color:var(--ink);text-decoration:underline;text-underline-offset:3px;
  display:inline-block;padding:.45rem .35rem;margin:-.45rem -.35rem}
a:hover{color:var(--ink-2)}
a:focus-visible{outline:2px solid #3A7596;outline-offset:3px}

/* settles in once; visible by default if the animation never runs */
@media (prefers-reduced-motion:no-preference){
  main{animation:in .9s cubic-bezier(.22,1,.36,1) backwards}
  @keyframes in{from{opacity:0;transform:translateY(12px)}}
}
</style>
</head>
<body>

<main>
  <img class="mark" src="img/invi-wordmark.png" alt="INVI" width="900" height="220" fetchpriority="high" decoding="async">
  <hr class="rule">
  <h1>Site in development</h1>
  <p>Back soon. In the meantime, <a href="mailto:hello@invi.com">hello@invi.com</a>.</p>
</main>

</body>
</html>
